[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["latcom", "latcom.*"]

[project]
name = "latcom"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "astropy",
    "astroquery",
    "dill",
    "h5py",
    "matplotlib",
    "marsmodel @ git+https://github.com/Sulla2012/mars_model",
    "numpy",
    "pandas",
    "pixell",
    "PyYAML",
    "Requests",
    "scipy",
    "so3g",
    "sotodlib",
    "ruff",
]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
preview = true
extend-select = ["I", "DOC501"]


[tool.ruff.lint.pydocstyle]
convention = "numpy"
